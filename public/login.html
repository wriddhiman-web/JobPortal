<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body data-page="login">
    <header><nav id="main-nav"></nav></header>

    <main class="container" style="max-width: 480px;">
        <div id="flash-message"></div>

        <div class="card">
            <h2 style="margin-bottom: 1.25rem;">Sign In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Sign In</button>
            </form>

            <p style="margin-top: 1.25rem; font-size: 0.9rem; text-align: center;">
                Don't have an account? <a href="register.html">Register here</a>
            </p>

            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid var(--border);">

            <div>
                <p style="font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted);">Quick Demo Logins:</p>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button type="button" class="btn btn-outline btn-sm demo-login-btn" data-email="admin@jobportal.test" data-password="Password123!">Admin</button>
                    <button type="button" class="btn btn-outline btn-sm demo-login-btn" data-email="employer@jobportal.test" data-password="Password123!">Employer</button>
                    <button type="button" class="btn btn-outline btn-sm demo-login-btn" data-email="seeker@jobportal.test" data-password="Password123!">Seeker</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
