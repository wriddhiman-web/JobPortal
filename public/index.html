<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal - Browse Jobs</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body data-page="index">
    <header><nav id="main-nav"></nav></header>

    <main class="container">
        <div id="flash-message"></div>

        <section class="card">
            <h2 style="margin-bottom: 1rem;">Find Your Next Role</h2>
            <form id="search-form" class="filter-grid">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="search-keyword">Keyword</label>
                    <input type="text" id="search-keyword" placeholder="Job title, keywords, or company">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="search-location">Location</label>
                    <input type="text" id="search-location" placeholder="City, state, or Remote">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="search-type">Type</label>
                    <select id="search-type">
                        <option value="">All Types</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract</option>
                        <option value="Remote">Remote</option>
                        <option value="Internship">Internship</option>
                    </select>
                </div>
                <button type="submit" class="btn">Search</button>
                <button type="button" id="search-reset" class="btn btn-outline">Reset</button>
            </form>
        </section>

        <section id="jobs-list"></section>
        <div id="pagination" class="pagination"></div>
    </main>
</body>
</html>
