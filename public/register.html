<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body data-page="register">
    <header><nav id="main-nav"></nav></header>

    <main class="container" style="max-width: 480px;">
        <div id="flash-message"></div>

        <div class="card">
            <h2 style="margin-bottom: 1.25rem;">Create an Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password (min 6 characters)</label>
                    <input type="password" id="reg-password" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="reg-role">I am a</label>
                    <select id="reg-role" required>
                        <option value="seeker">Job Seeker</option>
                        <option value="employer">Employer</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>

            <p style="margin-top: 1.25rem; font-size: 0.9rem; text-align: center;">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </main>
</body>
</html>
